[meta]
project = "operator_box_to_plc"

# Outbound: connects to the PLC.
[[transport]]
id    = "plc"
kind  = "modbus_tcp_client"
host  = "127.0.0.1"
port  = 51500
slave_id = 1
connect_timeout_ms    = 500
reconnect_interval_ms = 3000

# Inbound: hosts a Modbus server the operator boxes connect to.
[[transport]]
id   = "box"
kind = "modbus_tcp_server"
listen_address = "127.0.0.1"
listen_port    = 5020
slave_id       = 1
[[transport.listen_ranges]]
table = "HR"
range = [0, 64]

# Poll the PLC status image that the operator box reads back.
[[poll_range]]
module_id = "poll.plc.status"
transport = "plc"
table     = "HR"
range     = [50, 4]
period_ms = 100

# Segment bridge: operator commands HR[0..3] go to the same PLC addresses;
# each successful PLC HR[50..53] poll mirrors its untouched U16 image back to
# the server. No placeholder datapoints are required for this raw mirror.
[[bridge]]
server = "box"
plc = "plc"
offset = 0
write_start = 0
write_count = 4
mirror_start = 50
mirror_count = 4
mirror_policy = "AfterPoll"
