[meta]
project = "field_gateway_s7_mock"
version = "0.1"
log_level = "info"

[control]
listen_address = "127.0.0.1"
listen_port = 15034

[[codec]]
id = "run_state"
kind = "enum_u16"
map = { "0" = "stopped", "1" = "running", "2" = "fault" }

[[transport]]
id = "s7_1"
kind = "s7_client"
host = "127.0.0.1"
rack = 0
slot = 1
db = 1                      # DB number for HR-mapped reads (addr = word index, byte = addr*2)
connect_timeout_ms = 4000
request_timeout_ms = 1000

[transport.scheduler]
kind = "credit"
max_inflight = 1
max_queue_depth = 64

[[poll_range]]
module_id = "poll_s7"
transport = "s7_1"
table = "HR"
range = [0, 3]              # words 0..2 -> DBW0/DBW2/DBW4
period_ms = 300

[[datapoint]]
id = "s7.temperature"
kind = "Status"
type = "U16"

[datapoint.source]
port = "s7_1"
table = "HR"
addr = 0                    # DBW0
scale = 0.1

[[datapoint]]
id = "s7.speed"
kind = "Status"
type = "U16"

[datapoint.source]
port = "s7_1"
table = "HR"
addr = 1                    # DBW2

[[datapoint]]
id = "s7.run_state"
kind = "Status"
type = "EnumU16"

[datapoint.source]
port = "s7_1"
table = "HR"
addr = 2                    # DBW4
codec = "run_state"
