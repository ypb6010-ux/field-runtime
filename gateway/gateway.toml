[meta]
project = "field_gateway_modbus_mock"
version = "0.2"
log_level = "info"

[control]
listen_address = "127.0.0.1"
listen_port = 15022
# Empty auth_token keeps write commands disabled. Read-only status/live/help remain open.
auth_token = "field-gateway-token"

[northbound.mqtt]
enable = true
host = "127.0.0.1"
port = 1883
client_id = "field_gateway_mock"
keepalive_s = 10
topic_prefix = "field"
qos = 0
publish_interval_ms = 0

[persistence]
enable = true
path = "field_gateway.db"
max_rows = 100000
backfill_batch = 32

[[transport]]
id = "mock_plc"
kind = "modbus_tcp_client"
host = "127.0.0.1"
port = 15020
slave_id = 1

[transport.scheduler]
kind = "serial"
max_inflight = 1
max_queue_depth = 64
inter_request_gap_ms = 0

[[transport]]
id = "opbox"
kind = "modbus_tcp_server"
listen_address = "127.0.0.1"
listen_port = 15021
slave_id = 1

[[transport.listen_ranges]]
table = "HR"
range = [0, 32]

[transport.scheduler]
kind = "serial"
max_inflight = 1
max_queue_depth = 64
inter_request_gap_ms = 0

[[poll_range]]
module_id = "poll_mock_hr"
transport = "mock_plc"
table = "HR"
range = [0, 12]
period_ms = 200

[[datapoint]]
id = "mock.temperature"
kind = "Status"
type = "U16"

[datapoint.source]
port = "mock_plc"
table = "HR"
addr = 0
scale = 0.1

[[datapoint]]
id = "mock.speed"
kind = "Status"
type = "U16"

[datapoint.source]
port = "mock_plc"
table = "HR"
addr = 1

[[datapoint]]
id = "mock.word32"
kind = "Status"
type = "U32"

[datapoint.source]
port = "mock_plc"
table = "HR"
addr = 2
wordOrder = "CDAB"

[[datapoint]]
id = "mock.forward"
kind = "Status"
type = "U16"

[datapoint.source]
port = "mock_plc"
table = "HR"
addr = 10

[[datapoint]]
id = "mock.writeback"
kind = "Status"
type = "U16"

[datapoint.source]
port = "mock_plc"
table = "HR"
addr = 11

[[bridge]]
server = "opbox"
plc = "mock_plc"
offset = 0
write_start = 10
write_count = 1
mirror_start = 0
mirror_count = 4
mirror_period_ms = 100
