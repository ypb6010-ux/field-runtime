[meta]
project = "field_gateway_opcua_mock"
version = "0.1"
log_level = "info"

[control]
listen_address = "127.0.0.1"
listen_port = 15032

[[codec]]
id = "run_state"
kind = "enum_u16"
map = { "0" = "stopped", "1" = "running", "2" = "fault" }

[[transport]]
id = "opc1"
kind = "opc_ua_client"
endpoint_url = "opc.tcp://127.0.0.1:4840"
node_id_template = "ns=2;s=Var_%1"
connect_timeout_ms = 4000
request_timeout_ms = 1000

[transport.scheduler]
kind = "credit"
max_inflight = 4
max_queue_depth = 64

[[poll_range]]
module_id = "poll_opc"
transport = "opc1"
table = "HR"
range = [0, 3]
period_ms = 300

[[datapoint]]
id = "opc.temperature"
kind = "Status"
type = "U16"

[datapoint.source]
port = "opc1"
table = "HR"
addr = 0
scale = 0.1

[[datapoint]]
id = "opc.speed"
kind = "Status"
type = "U16"

[datapoint.source]
port = "opc1"
table = "HR"
addr = 1

[[datapoint]]
id = "opc.run_state"
kind = "Status"
type = "EnumU16"

[datapoint.source]
port = "opc1"
table = "HR"
addr = 2
codec = "run_state"
